name: Stage npm release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # npm provenance and trusted publishing exchange this OIDC token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted and staged publishing need a recent npm 11; Node 22 bundles npm 10.
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - name: Stage the release
        run: |
          # Pre-releases (versions with a hyphen) must not become "latest".
          case "$(node -p "require('./package.json').version")" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          # The trusted publisher may only stage. A maintainer approves the
          # staged version with 2FA before anyone can install it.
          npm stage publish --provenance --access public --tag "$dist_tag"
