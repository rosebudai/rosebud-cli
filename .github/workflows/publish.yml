name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # npm provenance and trusted publishing exchange this OIDC token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 bundles npm 10.
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - name: Publish
        run: |
          # Pre-releases (versions with a hyphen) must not become "latest".
          case "$(node -p "require('./package.json').version")" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish --provenance --access public --tag "$dist_tag"
        env:
          # Unset once npm trusted publishing is configured for the package.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
